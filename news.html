<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Who Owns the Flavor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Instrument+Serif:ital@0;1&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>


    /* === PODCAST SECTION === */
    .podcast-section {
      background: var(--red1);
      color: #fff;
      padding: 3rem 2rem;
    }

    .podcast-section h2 {
      margin: 0 0 2rem 0;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
    }

    .podcast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .podcast-card {
      /* was an article; now will also be used on an <a> */
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #000;
      border: 2px solid white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .podcast-card:hover,
    .podcast-card:focus-visible {
      transform: scale(1.04);
      box-shadow: 0 0px 24px rgba(255, 255, 255, 1);
      outline: none;
    }

    .podcast-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }

    .podcast-content {
      padding: 1rem 1.2rem;
    }

    .podcast-title {
      color: var(--red1);
      margin: 0.5rem 0 0.5rem 0;
    }

    .podcast-desc {
      font-weight: bolder;
      font-style: italic;
      margin: 0 0 1rem 0;
    }

    /* replace the inner anchor with a span styled like a link */
    .podcast-cta {
      display: inline-block;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      color: var(--red1);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .podcast-credit {
      font-size: 0.5rem;
      font-family: helvetica;
      font-style: italic;
    }

    .podcast-credit a {
      color: white;
      text-decoration: none;
    }

    @media (max-width: 1000px) {
      .podcast-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .podcast-section {
        padding: 2rem 1rem;
        height: auto;
      }
      .podcast-card { border-radius: 10px; }

      .print-wrap { width: 100%; }
      .print-card { grid-template-columns: 1fr; }
      .print-thumb {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
        display: block;
      }
      .print-content { padding: 1rem; }
    }


    /* === PRINT SECTION === */
.print-section {
  background: var(--cream);
  color: #000;
  padding: 3rem 2rem 4rem;
}

.print-section h2 {
      margin: 0 0 2rem 0;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      color: var(--red1);
}

.print-wrap {
  width: min(60vw, 1100px);
  margin: 0 auto;
  display: grid;
  gap: 1.5rem;
}

.print-card {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 1.5rem;

  background: #fff;
  border: 3px solid transparent; /* keep width constant to avoid layout shift */
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.10);

  text-decoration: none;
  color: inherit;
  min-height: 220px;

  transition: border 0.2s;
}

.print-card:hover,
.print-card:focus-visible {
  box-shadow: 0 0px 20px rgba(0, 0, 0, 0.18);
  transition: box-shadow 0.2s;
  border-color: var(--red1); /* change only color; width stays constant */
}

.print-card:not(:has(.print-thumb)) {
  grid-template-columns: 1fr;
  min-height: auto;
}

.print-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  align-self: stretch;
}

.print-content {
  padding: 1rem 1rem;
  display: flex;
  flex-direction: column;
  justify-content: top;
}

.print-title {
  font-family: "Instrument Serif", serif;
  color: var(--red1);
  margin: 0 0 0.55rem 0;
}

.print-desc {
  font-family: "Courier New";
  font-weight: bolder;
  font-style: italic;
  margin: 0 0 1rem 0;
  color: rgba(0,0,0,0.85);
}

.print-cta {
  display: inline-block;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: bold;
  color: var(--red1);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.print-meta {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 0.75rem;
  color: rgba(0,0,0,0.55);
  margin: 0 0 0.6rem 0;
}

.print-meta .author {
  font-weight: bold;
}

.print-meta .sep {
  margin: 0 0.25rem;
}


@media (max-width: 1000px) {
  .print-wrap { width: 100%; }
  .print-card { grid-template-columns: 1fr; }
  .print-thumb { max-height: 180px; }
}

  </style>
</head>

<body>
  <script src="/nav.js"></script>

  <!-- === PODCAST SECTION === -->
  <section class="podcast-section" aria-labelledby="podcast-heading">
    <h2 id="podcast-heading">Podcast</h2>
    <div class="podcast-grid">
      {{PODCAST_CARDS}}
    </div>
  </section>

  <!-- === PRINT SECTION === -->
  <section class="print-section" aria-labelledby="print-heading">
    <h2 id="print-heading">Latest</h2>
  
    <div class="print-wrap">
      {{PRINT_CARDS}}
    </div>
  </section>


  
</body>
</html>
