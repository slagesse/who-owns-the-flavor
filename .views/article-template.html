<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Instrument+Serif:ital@0;1&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">

  <style>
    :root {
      --cream: #f3f3e7;
      --red1: #890d04;
      --gray: rgba(0, 0, 0, 0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background-color: var(--cream);
      font-family: "Instrument Serif", serif;
      color: #000;
    }

    /* === ARTICLE SECTION === */
    .article-container {
      max-width: 800px;
      margin: 1rem auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feature-image {
      width: 100%;
      height: 450px;
      background-color: #ddd;
      margin-bottom: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.12);
      object-fit: cover;
      display: block;
    }

    .feature-credit {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      color: rgba(0,0,0,0.6);
      text-align: left;
      margin: -1.3rem 0 0;
      font-style: italic;
    }

    .feature-credit a { color: rgba(0,0,0,0.6); }

    .article-title {
      font-family: "Instrument Serif", serif;
      font-size: 4rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      text-align: center;
      max-width: 28ch;
    }

    .article-subtitle {
      font-family: "Noto Serif", serif;
      font-size: 1.2rem;
      font-style: italic;
      color: rgba(0,0,0,0.55);
      text-align: center;
      margin: 0 auto 1.6rem;
      max-width: 100ch;
    }

    .byline {
      font-family: "Instrument Serif", serif;
      font-size: 1.8rem;
      text-align: center;
      color: var(--red1);
      margin: 0 0 0;
    }

    .byline-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
    }

    .byline-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(0,0,0,0.1);
    }

    .byline-sep {
      color: rgba(0,0,0,0.35);
      margin: 0 0.05rem;
    }

    .dateline {
      font-family: "Instrument Serif", serif;
      font-size: 1.4rem;
      color: rgba(0,0,0,0.6);
    }

    .article-paragraph {
      font-family: "Noto Serif";
      font-size: 1.3rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      max-width: 450px;
      font-weight: 400;
      margin-left: auto;
      margin-right: auto;
    }

    .section-label {
      font-family: "Instrument Serif", serif;
      font-size: 1.6rem;
      color: var(--red1);
      margin: 1.5rem auto 0.75rem;
      max-width: 450px;
      width: 100%;
      font-style: italic;
      font-weight: 800;
    }

    .pull-quote {
      max-width: 520px;
      margin: 2.1rem auto 2.2rem;
      padding: 1.4rem 1.6rem;
      border-left: 5px solid var(--red1);
      background: rgba(255,255,255,0.55);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
    }

    .pull-quote p {
      margin: 0;
      font-family: "Instrument Serif", serif;
      font-size: 1.7rem;
      line-height: 1.35;
      font-style: italic;
      color: rgba(0,0,0,0.9);
    }

    .pull-quote cite {
      display: block;
      margin-top: 0.8rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      color: rgba(0,0,0,0.6);
      font-style: normal;
    }

    .resource {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(0,0,0,0.7);
      max-width: 450px;
    }

    .resource a {
      color: var(--red1);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 600px) {
      .article-container { max-width: 90%; }
      .article-title { font-size: 2rem; }
      .article-subtitle { font-size: 0.95rem; }
      .byline { font-size: 1rem; }
      .dateline { font-size: 0.85rem; }
      .article-paragraph { font-size: 0.95rem; max-width: 75%; }
      .section-label { font-size: 1.1rem; max-width: 75%; }
      .pull-quote { max-width: 78%; }
    }
  </style>
</head>

<body>
  <script src="/nav.js"></script>

  <div class="article-container">
    <h2 class="article-title">{{HEADLINE}}</h2>
    {{SUBHEAD_BLOCK}}
    {{IMAGE_BLOCK}}

    <p class="byline">
      <span class="byline-wrap">
        <img class="byline-avatar" src="{{AUTHOR_HEADSHOT}}" alt="{{AUTHOR_NAME}} headshot" />
        By {{AUTHOR_NAME}}
        <span class="byline-sep">•</span>
        <span class="dateline">{{DATE}}</span>
      </span>
    </p>

    {{BODY}}
  </div>
</body>
</html>
